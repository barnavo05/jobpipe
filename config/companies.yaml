# Company career boards to watch. These use official public ATS APIs: free, no key, allowed.
#
# How to find a slug: open a company's careers page and look at the job link.
#   job-boards.greenhouse.io/<slug>/jobs/123   or  boards.greenhouse.io/<slug>  -> greenhouse
#   jobs.lever.co/<slug>/...                                                     -> lever
#   jobs.ashbyhq.com/<slug>/...                                                  -> ashby
#
# Every board below was checked on 30 Oct 2026 and had open roles in India.
# To find more: add slugs to config/candidates.txt and run "Discover company boards" in Actions.
# Bad slugs are just skipped at runtime, so a wrong guess never breaks the pipeline.

