name: Daily job alerts

# Timed runs only COLLECT (LinkedIn, Indeed, Naukri + company pages) so jobs are waiting.
# GitHub's timers are best effort and sometimes skip, so there are several; any one is enough.
# The digest itself is sent by Vercel's timer each morning (vercel.json).
# The "Run workflow" button does a full manual run: collect + send digests.
on:
  schedule:
    - cron: "13 23 * * *"   # 4:43 AM IST
    - cron: "13 1 * * *"    # 6:43 AM IST
    - cron: "13 7 * * *"    # 12:43 PM IST
    - cron: "13 13 * * *"   # 6:43 PM IST
  workflow_dispatch: {}

concurrency:
  group: jobpipe-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-full.txt
      - run: pip install -r requirements-full.txt
      - run: python -m pytest -q
      - run: python -m jobpipe ${{ github.event_name == 'schedule' && 'collect' || 'daily' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_POOLER_HOST: aws-1-us-west-2.pooler.supabase.com
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
