name: Telegram bot replies

# Answers new signups and button taps every ~10 minutes.
# GitHub can delay scheduled runs a bit under load. For instant replies, deploy
# the optional webhook (README Step 7) and delete this workflow.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: jobpipe-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m jobpipe bot --once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_POOLER_HOST: aws-1-us-west-2.pooler.supabase.com
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
